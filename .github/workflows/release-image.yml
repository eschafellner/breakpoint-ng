name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Use a release tag such as v0.1.0 or v0.1.1-rc.1.' >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  tests:
    name: Application and deployment tests
    needs: release
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build, check and publish image
    needs: [release, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing release
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This image version already exists. Create a new release version.' >&2
            exit 1
          fi
      - name: Build image for local checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: breakpoint-ng:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check packaged application and static files
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod \
            -e DJANGO_SECRET_KEY=release-image-check-only \
            -e DJANGO_ALLOWED_HOSTS=tennis.example \
            -e CSRF_TRUSTED_ORIGINS=https://tennis.example \
            -e PUBLIC_SITE_URL=https://tennis.example \
            --entrypoint sh breakpoint-ng:release-check scripts/check_release_image.sh
      - name: Build and publish release
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Show installation commands
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### Release-Image ist bereit'
            echo
            echo "Image: \`$RELEASE_IMAGE:$RELEASE_VERSION\`"
            echo
            echo 'Server-Update:'
            echo '```bash'
            echo "bash update.sh $RELEASE_IMAGE:$RELEASE_VERSION"
            echo '```'
            echo
            echo 'Alternativ exakt diesen Image-Inhalt über seinen Digest auswählen:'
            echo '```bash'
            echo "bash update.sh $RELEASE_IMAGE@$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
