[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisclub-cms"
version = "0.1.0"
description = "Modernes CMS & Buchungssystem für Tennisvereine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "Pillow>=10.0",
    "nh3>=0.2",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "celery>=5.3",
    "redis>=5.0",
    "cryptography>=42.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "freezegun>=1.4",
    "coverage>=7.0,<8",
    "ruff>=0.14",
    "black>=25.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.black]
target-version = ["py312"]
