{% extends "base.html" %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:480px;"><div class="card" style="padding:28px;">
  <h1>Zugang anfordern</h1>
  <p>Passwort vergessen, Einladung verloren oder E-Mail noch nicht bestätigt? Gib deine E-Mail-Adresse ein, um einen neuen Link anzufordern.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn court">Link anfordern</button></form>
  <p><a href="{% url 'accounts:login' %}">Zur Anmeldung</a></p>
</div></div></section>
{% endblock %}
