x-app: &app
  build: .
  image: breakpoint-ng:local
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY muss gesetzt sein}
    DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS muss gesetzt sein}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS muss gesetzt sein}
    DB_NAME: ${DB_NAME:-tennisclub}
    DB_USER: ${DB_USER:-tennisclub}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@tennisclub.local}
    PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tennisclub}
      POSTGRES_USER: ${DB_USER:-tennisclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs on first deployment and before the application is started.
  prepare:
    <<: *app
    restart: "no"
    command: ["sh", "/app/scripts/prepare.sh"]
    volumes:
      - static_prod_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --forwarded-allow-ips "*"
    volumes:
      - static_prod_volume:/app/staticfiles:ro
      - media_prod_volume:/app/media
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8000/healthz/"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod_volume:/app/staticfiles:ro
      - media_prod_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz/ && wget -q -O /dev/null http://127.0.0.1/static/css/styles.css"]
      interval: 10s
      timeout: 6s
      retries: 6

  celery_worker:
    <<: *app
    restart: always
    command: celery -A config worker -l info
    volumes:
      - media_prod_volume:/app/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout 5 --destination celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  celery_beat:
    <<: *app
    restart: always
    command: celery -A config beat -l info --schedule /app/celerybeat/schedule --pidfile /tmp/celerybeat.pid
    volumes:
      - celery_beat_prod_data:/app/celerybeat
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Configure the tunnel's origin as http://nginx:80 (previously web:8000).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN muss gesetzt sein}
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_prod_volume:
  media_prod_volume:
  celery_beat_prod_data:
