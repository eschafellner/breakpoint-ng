# Cloudflare terminates HTTPS; retain its scheme when proxying to Django.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# Immutable caching applies only to Django's content-hashed asset names.
map $uri $asset_cache_control {
    default "public, max-age=60";
    "~\.[0-9a-f]{12}\." "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The parent nginx.conf includes mime.types, including text/css.
    location = /static/staticfiles.json {
        return 404;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        add_header Cache-Control $asset_cache_control;
        add_header X-Content-Type-Options nosniff always;
    }

    # Django authorizes /media/ requests and issues X-Accel-Redirect.
    # Direct requests to this location are rejected by Nginx.
    location /_protected_media/ {
        internal;
        alias /app/media/;
        autoindex off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
